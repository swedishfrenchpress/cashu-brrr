<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Category Standard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { width:1440px; height:900px; overflow:hidden; }
  body { background:#fff; font-family:"Manrope",sans-serif; color:#111827; }
  nav { height:76px; display:flex; align-items:center; padding:0 72px; gap:36px; border-bottom:1px solid #F3F4F6; }
  nav .logo { font-weight:800; font-size:24px; margin-right:auto; }
  nav .logo span { color:#B45309; }
  nav a { font-size:15px; color:#4B5563; }
  nav .cta { background:#111827; color:#fff; padding:12px 22px; border-radius:12px; font-weight:600; }
  .hero { text-align:center; padding-top:72px; }
  .hero h1 { font-weight:800; font-size:68px; letter-spacing:-.03em; line-height:1.05; }
  .hero p { margin:20px auto 0; max-width:620px; font-size:20px; color:#4B5563; line-height:1.5; }
  .hero .btn { display:inline-block; margin-top:32px; background:#F7931A; color:#111827; font-weight:800; font-size:18px; padding:18px 34px; border-radius:14px; }
  .mock { margin:48px auto 0; width:1040px; height:420px; border-radius:18px; background:#F3F4F6; border:1px solid #E5E7EB; padding:22px; }
  .mock .bar { height:14px; width:90px; display:flex; gap:7px; margin-bottom:18px; }
  .mock .bar i { width:14px; height:14px; border-radius:50%; background:#D1D5DB; }
  .mock .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:18px; }
  .mock .card { background:#fff; border-radius:12px; height:150px; border:1px solid #E5E7EB; padding:14px; position:relative; }
  .mock .card::after { content:""; position:absolute; right:14px; top:14px; width:56px; height:56px; background:#111827; border-radius:4px; }
  .mock .card b { position:absolute; left:14px; bottom:14px; font-weight:800; font-size:22px; color:#111827; }
</style>
</head>
<body>
  <nav>
    <div class="logo">Cashu <span>Brrr</span></div>
    <a>How it works</a><a>FAQ</a><a>History</a>
    <span class="cta">Start printing</span>
  </nav>
  <section class="hero">
    <h1>Print your own ecash notes</h1>
    <p>Pick a design, pay one Lightning invoice, and print bitcoin ecash notes you can hand out like cash.</p>
    <span class="btn">Start printing &rarr;</span>
    <div class="mock">
      <div class="bar"><i></i><i></i><i></i></div>
      <div class="grid">
        <div class="card"><b>21 sat</b></div><div class="card"><b>21 sat</b></div><div class="card"><b>21 sat</b></div>
        <div class="card"><b>21 sat</b></div><div class="card"><b>21 sat</b></div><div class="card"><b>21 sat</b></div>
      </div>
    </div>
  </section>
</body>
</html>
